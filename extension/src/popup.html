<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Akıllı Todo</title>
    <style>
      body {
        width: 280px;
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #f1f5f9;
        margin: 0;
        padding: 12px;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 70px;
        resize: vertical;
        background: #020617;
        color: #f1f5f9;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 8px;
        font-family: inherit;
      }
      button {
        margin-top: 8px;
        width: 100%;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        background: #1d4ed8;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #94a3b8;
      }
      a {
        color: #60a5fa;
      }
    </style>
  </head>
  <body>
    <textarea id="taskText" placeholder="Ne yapman gerekiyor?"></textarea>
    <button id="submitButton">Inbox'a ekle</button>
    <p id="status"></p>
    <p><a href="#" id="openOptions">Ayarlar</a></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
